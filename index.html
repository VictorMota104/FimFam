<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças · PF/PJ</title>
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0B1220;
    --surface:#141B2E;
    --surface-2:#1B2439;
    --border:#2A3550;
    --text:#ECF1FA;
    --muted:#8A94AC;
    --pf:#35D0A8;
    --pf-dim:#1F5A4C;
    --pj:#F2B84B;
    --pj-dim:#5C4A22;
    --danger:#FF6B6B;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;}
  body{padding-bottom:48px;}
  .app{max-width:520px;margin:0 auto;padding:0 16px;}

  /* header */
  header.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:18px 0 8px;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:0.2px;}
  .brand small{color:var(--muted);font-size:11px;}

  .switch{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;}
  .switch button{flex:1;border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;
    padding:10px 0;border-radius:10px;font-family:var(--sans);transition:background .18s ease, color .18s ease;}
  .switch button.active{background:var(--accent, var(--pf));color:#08110E;}
  .switch button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* summary card */
  .summary{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:14px;}
  .summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .summary-row label{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .num-input{background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:16px;
    text-align:right;width:130px;font-variant-numeric:tabular-nums;}
  .num-input:focus{outline:none;color:var(--accent);}

  .stitch{height:0;border-top:2px dashed var(--border);margin:14px 0;position:relative;}
  .stitch::before,.stitch::after{content:"";position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--border);}
  .stitch::before{left:-32px;} .stitch::after{right:-32px;}

  .balance{text-align:center;padding:6px 0 2px;}
  .balance .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
  .balance .value{font-family:var(--mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-0.5px;margin-top:2px;}
  .balance .value.pos{color:var(--accent);}
  .balance .value.neg{color:var(--danger);}

  .progress{height:6px;border-radius:99px;background:var(--surface-2);margin-top:14px;overflow:hidden;}
  .progress > div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}

  .mini-stats{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;color:var(--muted);}
  .mini-stats b{color:var(--text);font-family:var(--mono);}

  /* breakdown bars */
  .breakdown{margin-top:14px;}
  .bd-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .bd-row .bd-label{width:92px;font-size:11px;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bd-track{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .bd-fill{height:100%;border-radius:99px;}
  .bd-val{width:64px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0;}

  /* category cards */
  .cat{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-top:12px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;}
  .cat-head .swatch{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:9px;flex-shrink:0;}
  .cat-head-left{display:flex;align-items:center;font-weight:700;font-size:14.5px;}
  .cat-head-right{display:flex;align-items:center;gap:10px;}
  .cat-total{font-family:var(--mono);font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .chevron{transition:transform .2s ease;color:var(--muted);}
  .chevron.open{transform:rotate(180deg);}

  .cat-body{padding:0 14px 14px;}
  .item{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--border);}
  .item:first-child{border-top:none;}
  .item.paid .item-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border);}
  .item.paid .item-val{color:var(--muted);}

  .checkbox{width:20px;height:20px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;}
  .checkbox.checked{background:var(--accent);border-color:var(--accent);}
  .checkbox svg{width:12px;height:12px;display:none;}
  .checkbox.checked svg{display:block;}

  .item-name{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:var(--sans);
    min-width:0;padding:4px 0;}
  .item-name:focus{outline:none;}
  .item-val{width:88px;background:transparent;border:none;color:var(--text);font-family:var(--mono);
    font-size:14px;text-align:right;font-variant-numeric:tabular-nums;padding:4px 0;}
  .item-val:focus{outline:none;color:var(--accent);}
  .item-del{background:transparent;border:none;color:var(--muted);width:22px;height:22px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;}
  .item-del:active{background:var(--surface-2);}

  .add-item{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:1px dashed var(--border);
    color:var(--muted);font-size:13px;font-weight:600;padding:9px;border-radius:10px;margin-top:10px;cursor:pointer;font-family:var(--sans);}
  .add-item:active{background:var(--surface-2);}

  /* PJ specific */
  .rate-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-top:12px;padding:14px 16px;}
  .rate-card h3{margin:0 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .rate-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);}
  .rate-row:first-of-type{border-top:none;}
  .rate-row .rate-label{font-size:14px;}
  .rate-row .rate-label small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:1px;}
  .rate-input-wrap{display:flex;align-items:center;gap:2px;}
  .rate-input{width:56px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);
    font-family:var(--mono);font-size:14px;text-align:right;padding:6px 6px;}
  .rate-input:focus{outline:none;border-color:var(--accent);}
  .rate-suffix{color:var(--muted);font-size:12px;width:20px;}

  .receipt{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-top:12px;padding:16px;}
  .receipt h3{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .receipt-line{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-top:1px dashed var(--border);}
  .receipt-line:first-child{border-top:none;}
  .receipt-line .val{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .receipt-line.total{font-weight:700;border-top:1px solid var(--border);margin-top:4px;padding-top:10px;}

  footer.note{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;line-height:1.6;padding:0 20px;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
   * STORAGE — tenta window.storage (artifact), cai para localStorage
   * (quando hospedado fora do claude.ai) e por fim memória.
   * ------------------------------------------------------------- */
  const STORAGE_KEY = "financas-pf-pj-v1";
  let memoryFallback = null;

  async function loadState(){
    try{
      if(window.storage && typeof window.storage.get === "function"){
        const r = await window.storage.get(STORAGE_KEY, false);
        if(r && r.value) return JSON.parse(r.value);
        return null;
      }
    }catch(e){ /* key not found or storage unavailable, segue pro fallback */ }
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* localStorage indisponível */ }
    return memoryFallback;
  }

  let saveTimer = null;
  function saveState(state){
    memoryFallback = state;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const json = JSON.stringify(state);
      try{
        if(window.storage && typeof window.storage.set === "function"){
          await window.storage.set(STORAGE_KEY, json, false);
          return;
        }
      }catch(e){}
      try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
    }, 250);
  }

  /* ---------------------------------------------------------------
   * DADOS INICIAIS — pré-preenchidos com a planilha enviada
   * ------------------------------------------------------------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }

  function defaultState(){
    return {
      view: "pf",
      pf: {
        salario: 9300,
        categories: [
          { id:"fixas", name:"Contas Fixas", color:"#35D0A8", items:[
            {id:uid(), name:"Dass", valor:0, pago:true},
            {id:uid(), name:"Apartamento", valor:1560, pago:false},
            {id:uid(), name:"Ajuda em casa", valor:700, pago:false},
            {id:uid(), name:"Inglês", valor:0, pago:false},
          ]},
          { id:"assinaturas", name:"Assinaturas", color:"#6AA9FF", items:[
            {id:uid(), name:"Claude", valor:109, pago:false},
            {id:uid(), name:"YouTube", valor:24, pago:false},
            {id:uid(), name:"iCloud", valor:9, pago:false},
            {id:uid(), name:"HBO Max", valor:23, pago:false},
            {id:uid(), name:"iFood", valor:8, pago:false},
            {id:uid(), name:"Tim", valor:60, pago:false},
            {id:uid(), name:"Apple", valor:20, pago:false},
            {id:uid(), name:"Hostinger", valor:0, pago:false},
          ]},
          { id:"investimentos", name:"Investimentos", color:"#F2B84B", items:[
            {id:uid(), name:"Bolão 2026", valor:250, pago:true},
            {id:uid(), name:"Férias", valor:500, pago:true},
            {id:uid(), name:"Reserva de emergência", valor:500, pago:true},
          ]},
          { id:"cartao", name:"Cartão de Crédito", color:"#FF6B6B", items:[
            {id:uid(), name:"Itaú", valor:1763, pago:false},
            {id:uid(), name:"Nubank", valor:500, pago:false},
          ]},
        ],
        open: {fixas:true, assinaturas:true, investimentos:true, cartao:true}
      },
      pj: {
        faturamento: 2739.13,
        taxaProLabore: 0.28,
        taxaDAS: 0.06,
        taxaINSS: 0.11,
        contador: 250,
        variaveis: [
          {id:uid(), name:"Abertura ME", valor:250},
        ]
      }
    };
  }

  let state = null;

  /* ---------------------------------------------------------------
   * CÁLCULOS
   * ------------------------------------------------------------- */
  function fmt(n){
    n = Number(n)||0;
    return n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function pfCompute(pf){
    const catTotals = pf.categories.map(c => ({
      id:c.id, name:c.name, color:c.color,
      total: c.items.reduce((s,i)=>s+(Number(i.valor)||0),0),
      pago: c.items.reduce((s,i)=> i.pago ? s+(Number(i.valor)||0) : s, 0),
    }));
    const totalDespesas = catTotals.reduce((s,c)=>s+c.total,0);
    const totalPago = catTotals.reduce((s,c)=>s+c.pago,0);
    const restante = (Number(pf.salario)||0) - totalDespesas;
    const itemCount = pf.categories.reduce((s,c)=>s+c.items.length,0);
    const paidCount = pf.categories.reduce((s,c)=>s+c.items.filter(i=>i.pago).length,0);
    return {catTotals, totalDespesas, totalPago, restante, itemCount, paidCount};
  }

  function pjCompute(pj){
    const faturamento = Number(pj.faturamento)||0;
    const proLaboreBruto = faturamento * (Number(pj.taxaProLabore)||0);
    const guiaDAS = faturamento * (Number(pj.taxaDAS)||0);
    const guiaINSS = proLaboreBruto * (Number(pj.taxaINSS)||0);
    const contador = Number(pj.contador)||0;
    const totalImpostosFixas = proLaboreBruto + guiaDAS + guiaINSS + contador;
    const totalVariaveis = pj.variaveis.reduce((s,i)=>s+(Number(i.valor)||0),0);
    const totalDespesas = totalImpostosFixas + totalVariaveis;
    const proLaboreLiquido = proLaboreBruto - guiaINSS;
    const restante = faturamento + proLaboreLiquido - totalDespesas;
    return {proLaboreBruto, guiaDAS, guiaINSS, contador, totalImpostosFixas, totalVariaveis, totalDespesas, proLaboreLiquido, restante};
  }

  /* ---------------------------------------------------------------
   * RENDER
   * ------------------------------------------------------------- */
  const root = document.getElementById("app");

  function checkSvg(){
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#08110E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevronSvg(open){
    return `<svg class="chevron${open?" open":""}" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function trashSvg(){
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M9 7V4.5C9 4 9.4 3.5 10 3.5H14C14.6 3.5 15 4 15 4.5V7M18 7L17.3 19C17.2 19.8 16.5 20.5 15.7 20.5H8.3C7.5 20.5 6.8 19.8 6.7 19L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function plusSvg(){
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  }

  function renderSwitch(){
    const accent = state.view === "pf" ? "var(--pf)" : "var(--pj)";
    return `
    <div class="switch" style="--accent:${accent}">
      <button data-action="set-view" data-view="pf" class="${state.view==='pf'?'active':''}">Pessoa Física</button>
      <button data-action="set-view" data-view="pj" class="${state.view==='pj'?'active':''}">Pessoa Jurídica</button>
    </div>`;
  }

  function renderPF(){
    const pf = state.pf;
    const c = pfCompute(pf);
    const accent = "var(--pf)";
    const progressPct = Math.min(100, (c.totalDespesas / (Number(pf.salario)||1)) * 100);
    const paidPct = c.itemCount ? Math.round((c.paidCount/c.itemCount)*100) : 0;

    const balanceClass = c.restante >= 0 ? "pos" : "neg";

    const breakdown = c.catTotals.map(ct=>{
      const pct = c.totalDespesas ? (ct.total/c.totalDespesas)*100 : 0;
      return `<div class="bd-row">
        <div class="bd-label">${ct.name}</div>
        <div class="bd-track"><div class="bd-fill" style="width:${pct}%;background:${ct.color}"></div></div>
        <div class="bd-val">${fmt(ct.total)}</div>
      </div>`;
    }).join("");

    const cats = pf.categories.map(cat=>{
      const total = cat.items.reduce((s,i)=>s+(Number(i.valor)||0),0);
      const open = pf.open[cat.id];
      const items = cat.items.map(it=>`
        <div class="item ${it.pago?'paid':''}" data-item-id="${it.id}">
          <button class="checkbox ${it.pago?'checked':''}" data-action="toggle-pago" data-cat="${cat.id}" data-item="${it.id}">${checkSvg()}</button>
          <input class="item-name" data-action="edit-name" data-cat="${cat.id}" data-item="${it.id}" value="${escapeAttr(it.name)}" placeholder="Nome">
          <input class="item-val" inputmode="decimal" data-action="edit-valor" data-cat="${cat.id}" data-item="${it.id}" value="${fmt(it.valor)}">
          <button class="item-del" data-action="del-item" data-cat="${cat.id}" data-item="${it.id}">${trashSvg()}</button>
        </div>`).join("");

      return `
      <div class="cat">
        <div class="cat-head" data-action="toggle-cat" data-cat="${cat.id}">
          <div class="cat-head-left"><span class="swatch" style="background:${cat.color}"></span>${cat.name}</div>
          <div class="cat-head-right">
            <span class="cat-total">R$ ${fmt(total)}</span>
            ${chevronSvg(open)}
          </div>
        </div>
        ${open ? `<div class="cat-body">
          ${items || '<div style="color:var(--muted);font-size:13px;padding:8px 2px;">Nenhum item ainda.</div>'}
          <button class="add-item" data-action="add-item" data-cat="${cat.id}">${plusSvg()} Adicionar item</button>
        </div>` : ""}
      </div>`;
    }).join("");

    return `
    <div class="summary" style="--accent:${accent}">
      <div class="summary-row">
        <label>Salário líquido</label>
        <input class="num-input" inputmode="decimal" data-action="edit-salario" value="${fmt(pf.salario)}">
      </div>
      <div class="summary-row">
        <label>Total de despesas</label>
        <span class="num-input" style="color:var(--muted)">R$ ${fmt(c.totalDespesas)}</span>
      </div>
      <div class="stitch"></div>
      <div class="balance">
        <div class="label">Restante do mês</div>
        <div class="value ${balanceClass}">R$ ${fmt(c.restante)}</div>
      </div>
      <div class="progress"><div style="width:${progressPct}%;background:${progressPct>=100?'var(--danger)':'var(--pf)'}"></div></div>
      <div class="mini-stats">
        <span>Comprometido: <b>${Math.round(progressPct)}%</b> do salário</span>
        <span><b>${c.paidCount}/${c.itemCount}</b> contas pagas (${paidPct}%)</span>
      </div>
      <div class="breakdown">${breakdown}</div>
    </div>
    ${cats}
    `;
  }

  function renderPJ(){
    const pj = state.pj;
    const c = pjCompute(pj);
    const accent = "var(--pj)";
    const balanceClass = c.restante >= 0 ? "pos" : "neg";

    const variaveis = pj.variaveis.map(it=>`
      <div class="item" data-item-id="${it.id}">
        <input class="item-name" data-action="edit-name-pj" data-item="${it.id}" value="${escapeAttr(it.name)}" placeholder="Nome" style="padding-left:0;">
        <input class="item-val" inputmode="decimal" data-action="edit-valor-pj" data-item="${it.id}" value="${fmt(it.valor)}">
        <button class="item-del" data-action="del-item-pj" data-item="${it.id}">${trashSvg()}</button>
      </div>`).join("");

    return `
    <div class="summary" style="--accent:${accent}">
      <div class="summary-row">
        <label>Faturamento</label>
        <input class="num-input" inputmode="decimal" data-action="edit-faturamento" value="${fmt(pj.faturamento)}">
      </div>
      <div class="summary-row">
        <label>Total de despesas</label>
        <span class="num-input" style="color:var(--muted)">R$ ${fmt(c.totalDespesas)}</span>
      </div>
      <div class="stitch"></div>
      <div class="balance">
        <div class="label">Restante do mês</div>
        <div class="value ${balanceClass}">R$ ${fmt(c.restante)}</div>
      </div>
    </div>

    <div class="rate-card" style="--accent:${accent}">
      <h3>Taxas de cálculo</h3>
      <div class="rate-row">
        <div class="rate-label">Pró-labore<small>% do faturamento</small></div>
        <div class="rate-input-wrap">
          <input class="rate-input" inputmode="decimal" data-action="edit-taxa" data-taxa="taxaProLabore" value="${(pj.taxaProLabore*100).toFixed(1)}">
          <span class="rate-suffix">%</span>
        </div>
      </div>
      <div class="rate-row">
        <div class="rate-label">Guia DAS<small>% do faturamento</small></div>
        <div class="rate-input-wrap">
          <input class="rate-input" inputmode="decimal" data-action="edit-taxa" data-taxa="taxaDAS" value="${(pj.taxaDAS*100).toFixed(1)}">
          <span class="rate-suffix">%</span>
        </div>
      </div>
      <div class="rate-row">
        <div class="rate-label">Guia INSS<small>% sobre o pró-labore</small></div>
        <div class="rate-input-wrap">
          <input class="rate-input" inputmode="decimal" data-action="edit-taxa" data-taxa="taxaINSS" value="${(pj.taxaINSS*100).toFixed(1)}">
          <span class="rate-suffix">%</span>
        </div>
      </div>
      <div class="rate-row">
        <div class="rate-label">Contador<small>valor fixo mensal</small></div>
        <div class="rate-input-wrap">
          <span class="rate-suffix" style="width:auto;margin-right:2px;">R$</span>
          <input class="rate-input" style="width:72px" inputmode="decimal" data-action="edit-contador" value="${fmt(pj.contador)}">
        </div>
      </div>
    </div>

    <div class="receipt">
      <h3>Impostos + fixas</h3>
      <div class="receipt-line"><span>Pró-labore bruto</span><span class="val">R$ ${fmt(c.proLaboreBruto)}</span></div>
      <div class="receipt-line"><span>Guia DAS</span><span class="val">R$ ${fmt(c.guiaDAS)}</span></div>
      <div class="receipt-line"><span>Guia INSS</span><span class="val">R$ ${fmt(c.guiaINSS)}</span></div>
      <div class="receipt-line"><span>Contador</span><span class="val">R$ ${fmt(c.contador)}</span></div>
      <div class="receipt-line total"><span>Total impostos + fixas</span><span class="val">R$ ${fmt(c.totalImpostosFixas)}</span></div>
    </div>

    <div class="cat">
      <div class="cat-head" data-action="toggle-cat-pj">
        <div class="cat-head-left"><span class="swatch" style="background:var(--pj)"></span>Variáveis</div>
        <div class="cat-head-right"><span class="cat-total">R$ ${fmt(c.totalVariaveis)}</span></div>
      </div>
      <div class="cat-body">
        ${variaveis || '<div style="color:var(--muted);font-size:13px;padding:8px 2px;">Nenhum item ainda.</div>'}
        <button class="add-item" data-action="add-item-pj">${plusSvg()} Adicionar item</button>
      </div>
    </div>

    <div class="receipt">
      <h3>Resumo</h3>
      <div class="receipt-line"><span>Faturamento</span><span class="val">R$ ${fmt(pj.faturamento)}</span></div>
      <div class="receipt-line"><span>Pró-labore líquido</span><span class="val">R$ ${fmt(c.proLaboreLiquido)}</span></div>
      <div class="receipt-line"><span>Total despesas</span><span class="val">R$ -${fmt(c.totalDespesas)}</span></div>
      <div class="receipt-line total"><span>Restante</span><span class="val">R$ ${fmt(c.restante)}</span></div>
    </div>
    `;
  }

  function escapeAttr(s){
    return String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }

  function render(){
    root.innerHTML = `
      <header class="top">
        <div class="brand"><h1>Finanças</h1><small>PF · PJ</small></div>
        ${renderSwitch()}
      </header>
      <main>
        ${state.view === "pf" ? renderPF() : renderPJ()}
      </main>
      <footer class="note">Os dados ficam salvos neste dispositivo/artifact. Toque nos valores para editar.</footer>
    `;
  }

  /* ---------------------------------------------------------------
   * PATCH LEVE — recalcula sem re-renderizar tudo (mantém o foco
   * do campo enquanto a pessoa digita)
   * ------------------------------------------------------------- */
  function patchTotals(){
    if(state.view === "pf"){
      const pf = state.pf, c = pfCompute(pf);
      // atualiza totais por categoria
      pf.categories.forEach(cat=>{
        const total = cat.items.reduce((s,i)=>s+(Number(i.valor)||0),0);
        const el = root.querySelector(`.cat-head[data-cat="${cat.id}"] .cat-total`);
        if(el) el.textContent = `R$ ${fmt(total)}`;
      });
      const balEl = root.querySelector(".balance .value");
      if(balEl){
        balEl.textContent = `R$ ${fmt(c.restante)}`;
        balEl.className = "value " + (c.restante>=0 ? "pos":"neg");
      }
      const summarySpans = root.querySelectorAll(".summary-row .num-input[style]");
      if(summarySpans[0]) summarySpans[0].textContent = `R$ ${fmt(c.totalDespesas)}`;
      const progressPct = Math.min(100, (c.totalDespesas/(Number(pf.salario)||1))*100);
      const progEl = root.querySelector(".progress > div");
      if(progEl){ progEl.style.width = progressPct+"%"; progEl.style.background = progressPct>=100 ? "var(--danger)" : "var(--pf)"; }
      const miniSpans = root.querySelectorAll(".mini-stats b");
      if(miniSpans[0]) miniSpans[0].textContent = Math.round(progressPct)+"%";
      // breakdown bars
      const bdRows = root.querySelectorAll(".bd-row");
      c.catTotals.forEach((ct,idx)=>{
        const row = bdRows[idx];
        if(!row) return;
        const pct = c.totalDespesas ? (ct.total/c.totalDespesas)*100 : 0;
        row.querySelector(".bd-fill").style.width = pct+"%";
        row.querySelector(".bd-val").textContent = fmt(ct.total);
      });
    } else {
      const pj = state.pj, c = pjCompute(pj);
      const balEl = root.querySelector(".balance .value");
      if(balEl){
        balEl.textContent = `R$ ${fmt(c.restante)}`;
        balEl.className = "value " + (c.restante>=0 ? "pos":"neg");
      }
      const summarySpans = root.querySelectorAll(".summary-row .num-input[style]");
      if(summarySpans[0]) summarySpans[0].textContent = `R$ ${fmt(c.totalDespesas)}`;
      const lines = root.querySelectorAll(".receipt-line .val");
      // ordem: proLaboreBruto, guiaDAS, guiaINSS, contador, totalImpostosFixas, (variaveis card own total), faturamento, proLaboreLiquido, totalDespesas, restante
      if(lines.length >= 5){
        lines[0].textContent = `R$ ${fmt(c.proLaboreBruto)}`;
        lines[1].textContent = `R$ ${fmt(c.guiaDAS)}`;
        lines[2].textContent = `R$ ${fmt(c.guiaINSS)}`;
        lines[3].textContent = `R$ ${fmt(c.contador)}`;
        lines[4].textContent = `R$ ${fmt(c.totalImpostosFixas)}`;
      }
      const varTotalEl = root.querySelector('.cat-head[data-action="toggle-cat-pj"] .cat-total');
      if(varTotalEl) varTotalEl.textContent = `R$ ${fmt(c.totalVariaveis)}`;
      if(lines.length >= 9){
        lines[5].textContent = `R$ ${fmt(pj.faturamento)}`;
        lines[6].textContent = `R$ ${fmt(c.proLaboreLiquido)}`;
        lines[7].textContent = `R$ -${fmt(c.totalDespesas)}`;
        lines[8].textContent = `R$ ${fmt(c.restante)}`;
      }
    }
  }

  function parseNum(v){
    if(typeof v !== "string") return Number(v)||0;
    const cleaned = v.replace(/\./g,"").replace(",",".").replace(/[^0-9.\-]/g,"");
    return Number(cleaned)||0;
  }

  /* ---------------------------------------------------------------
   * EVENTOS (delegação)
   * ------------------------------------------------------------- */
  root.addEventListener("click", (e)=>{
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;

    if(action === "set-view"){
      state.view = el.dataset.view;
      saveState(state); render(); return;
    }
    if(action === "toggle-cat"){
      const cat = el.dataset.cat;
      state.pf.open[cat] = !state.pf.open[cat];
      saveState(state); render(); return;
    }
    if(action === "toggle-cat-pj"){
      const body = el.parentElement.querySelector(".cat-body");
      if(body) body.style.display = body.style.display === "none" ? "" : "none";
      return;
    }
    if(action === "toggle-pago"){
      const cat = state.pf.categories.find(c=>c.id===el.dataset.cat);
      const item = cat.items.find(i=>i.id===el.dataset.item);
      item.pago = !item.pago;
      saveState(state);
      el.classList.toggle("checked", item.pago);
      el.closest(".item").classList.toggle("paid", item.pago);
      // atualiza estatística de pagos
      const c = pfCompute(state.pf);
      const miniSpans = root.querySelectorAll(".mini-stats b");
      if(miniSpans[1]){
        const paidPct = c.itemCount ? Math.round((c.paidCount/c.itemCount)*100) : 0;
        miniSpans[1].textContent = `${c.paidCount}/${c.itemCount}`;
        miniSpans[1].parentElement.innerHTML = `<b>${c.paidCount}/${c.itemCount}</b> contas pagas (${paidPct}%)`;
      }
      return;
    }
    if(action === "add-item"){
      const cat = state.pf.categories.find(c=>c.id===el.dataset.cat);
      cat.items.push({id:uid(), name:"Novo item", valor:0, pago:false});
      saveState(state); render(); return;
    }
    if(action === "del-item"){
      const cat = state.pf.categories.find(c=>c.id===el.dataset.cat);
      cat.items = cat.items.filter(i=>i.id!==el.dataset.item);
      saveState(state); render(); return;
    }
    if(action === "add-item-pj"){
      state.pj.variaveis.push({id:uid(), name:"Novo item", valor:0});
      saveState(state); render(); return;
    }
    if(action === "del-item-pj"){
      state.pj.variaveis = state.pj.variaveis.filter(i=>i.id!==el.dataset.item);
      saveState(state); render(); return;
    }
  });

  root.addEventListener("input", (e)=>{
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;

    if(action === "edit-name"){
      const cat = state.pf.categories.find(c=>c.id===el.dataset.cat);
      const item = cat.items.find(i=>i.id===el.dataset.item);
      item.name = el.value; saveState(state); return;
    }
    if(action === "edit-valor"){
      const cat = state.pf.categories.find(c=>c.id===el.dataset.cat);
      const item = cat.items.find(i=>i.id===el.dataset.item);
      item.valor = parseNum(el.value); saveState(state); patchTotals(); return;
    }
    if(action === "edit-salario"){
      state.pf.salario = parseNum(el.value); saveState(state); patchTotals(); return;
    }
    if(action === "edit-name-pj"){
      const item = state.pj.variaveis.find(i=>i.id===el.dataset.item);
      item.name = el.value; saveState(state); return;
    }
    if(action === "edit-valor-pj"){
      const item = state.pj.variaveis.find(i=>i.id===el.dataset.item);
      item.valor = parseNum(el.value); saveState(state); patchTotals(); return;
    }
    if(action === "edit-faturamento"){
      state.pj.faturamento = parseNum(el.value); saveState(state); patchTotals(); return;
    }
    if(action === "edit-contador"){
      state.pj.contador = parseNum(el.value); saveState(state); patchTotals(); return;
    }
    if(action === "edit-taxa"){
      const taxa = el.dataset.taxa;
      state.pj[taxa] = parseNum(el.value)/100; saveState(state); patchTotals(); return;
    }
  });

  // ao sair do campo, reformata número bonitinho (com casas decimais)
  root.addEventListener("blur", (e)=>{
    const el = e.target;
    if(el.matches && el.matches('[data-action^="edit-valor"], [data-action="edit-salario"], [data-action="edit-faturamento"], [data-action="edit-contador"]')){
      render();
    }
  }, true);

  /* ---------------------------------------------------------------
   * INIT
   * ------------------------------------------------------------- */
  (async function init(){
    const saved = await loadState();
    state = saved || defaultState();
    // garante estrutura completa caso storage tenha versão antiga
    if(!state.pf || !state.pj) state = defaultState();
    render();
  })();

  // registra service worker (silencioso se indisponível, ex.: dentro do preview do artifact)
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
