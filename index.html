<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Finanças · PF/PJ</title>
<meta name="theme-color" content="#14100B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    /* tons de tinta sobre papel de ledger — não é o azul-marinho + neon padrão */
    --bg:#100C08;
    --surface:#221B12; --surface-2:#2A2116; --surface-3:#33281A;
    --border:#3C3020; --text:#F1E9D8; --muted:#A99C82; --muted-2:#786C54;

    --pf:#6FAE87; --pf-ink:#0B1C13;      /* verde-cédula */
    --pj:#C99A3E; --pj-ink:#241804;      /* ocre de carimbo */
    --danger:#C1543C;                     /* tijolo, não vermelho neon */

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;   /* voz do app: títulos e rótulos */
    --tap:44px; --action-w:92px;
    --ease: cubic-bezier(.22,.8,.26,1);
  }
  [data-view="pf"]{ --accent:var(--pf); --accent-ink:var(--pf-ink); }
  [data-view="pj"]{ --accent:var(--pj); --accent-ink:var(--pj-ink); }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%; background:var(--bg);}
  body{
    margin:0; color:var(--text); font-family:var(--sans); background:var(--bg);
    position:relative;
    overscroll-behavior-y:contain;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            calc(env(safe-area-inset-bottom) + 40px) env(safe-area-inset-left);
  }
  /* vinheta quente e fixa — não é um gradiente que rola com a página */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(900px 480px at 50% -8%, #241B10, transparent 62%);
  }
  input{-webkit-user-select:text; user-select:text;}
  .app{max-width:540px; margin:0 auto; padding:0 16px;}


  /* cabeçalho */
  header.top{position:sticky; top:0; z-index:30; background:var(--bg);
    margin:0 -16px; padding:calc(14px + env(safe-area-inset-top)) 16px 10px;}
  header.top::after{content:""; position:absolute; left:0; right:0; bottom:-18px; height:18px;
    background:linear-gradient(180deg,var(--bg),transparent); pointer-events:none;}
  .brand{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .brand h1{font-family:var(--serif); font-size:23px; margin:0; font-weight:600; letter-spacing:-.2px;}
  .brand .month{color:var(--muted); font-size:12px; font-weight:600;}

  /* o par de carimbos PF/PJ — a peça de assinatura do app */
  .switch{display:flex; justify-content:center; gap:22px; padding:10px 6px 6px;}
  .stamp{
    --rot:0deg;
    position:relative; flex:0 1 156px; min-height:64px; padding:0 14px;
    border:2px solid var(--muted-2); border-radius:14px; background:transparent;
    color:var(--muted); font-family:var(--serif); font-size:13.5px; font-weight:600;
    letter-spacing:.4px; line-height:1.28; text-transform:uppercase;
    transform:rotate(var(--rot));
    transition:transform .22s var(--ease), background .22s var(--ease),
               color .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);
  }
  .stamp::before{content:""; position:absolute; inset:5px; border:1.5px dashed currentColor;
    border-radius:9px; opacity:.5; pointer-events:none;}
  .stamp[data-view="pf"]{ --rot:-3deg; }
  .stamp[data-view="pj"]{ --rot:2.5deg; }
  .stamp[aria-selected="true"]{
    background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
    transform:rotate(calc(var(--rot) * .35)) scale(.97);
    box-shadow:0 3px 0 rgba(0,0,0,.28);
  }
  .stamp:active{ transform:rotate(calc(var(--rot) * .35)) scale(.93); }
  .stamp:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  /* resumo */
  .summary{background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:18px; margin-top:14px;}
  .sum-line{display:flex; justify-content:space-between; align-items:center; min-height:38px; gap:10px;}
  .sum-line .k{color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.7px; text-transform:uppercase;}
  .sum-line .v{font-family:var(--mono); font-size:17px; font-variant-numeric:tabular-nums;}
  .sum-line .v.muted{color:var(--muted);}

  .inline-field{display:flex; align-items:center; justify-content:flex-end; gap:5px;
    min-height:var(--tap); padding:0 10px; margin-right:-10px;
    border-radius:10px; border:1px solid transparent;
    transition:border-color .15s var(--ease), background .15s var(--ease);}
  .inline-field:focus-within{border-color:var(--accent); background:var(--surface-2);}
  .inline-field .pre{color:var(--muted); font-family:var(--mono); font-size:15px;}
  .inline-field input{width:118px; background:transparent; border:none; color:var(--text);
    font-family:var(--mono); font-size:17px; text-align:right;
    font-variant-numeric:tabular-nums; padding:0;}
  .inline-field input:focus{outline:none;}
  .edit-hint{width:14px; height:14px; flex-shrink:0; color:var(--muted-2); transition:color .15s var(--ease);}
  .inline-field:focus-within .edit-hint{color:var(--accent);}

  .perf{position:relative; height:0; border-top:2px dashed var(--border); margin:16px 0;}
  .perf::before,.perf::after{content:""; position:absolute; top:-8px; width:16px; height:16px;
    border-radius:50%; background:var(--bg);}
  .perf::before{left:-27px;} .perf::after{right:-27px;}

  .hero{text-align:center; padding:2px 0 4px;}
  .hero .k{color:var(--muted); font-size:11px; letter-spacing:1.4px; text-transform:uppercase; font-weight:700;}
  .hero .v{font-family:var(--mono); font-size:38px; font-weight:700;
    font-variant-numeric:tabular-nums; letter-spacing:-1.5px; margin-top:4px; line-height:1.1;}
  .hero .v.pos{color:var(--accent);} .hero .v.neg{color:var(--danger);}

  .meter{height:7px; border-radius:99px; background:var(--surface-2); margin-top:16px; overflow:hidden;}
  .meter > i{display:block; height:100%; border-radius:99px; background:var(--accent);
    transition:width .35s var(--ease), background .3s;}
  .meter > i.over{background:var(--danger);}
  .stats{display:flex; justify-content:space-between; margin-top:11px; font-size:12px; color:var(--muted); gap:10px;}
  .stats b{color:var(--text); font-family:var(--mono);}

  .split{margin-top:16px; display:flex; flex-direction:column; gap:9px;}
  .split-row{display:flex; align-items:center; gap:10px;}
  .split-row .sk{width:96px; flex-shrink:0; font-size:12px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .split-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .split-track > i{display:block; height:100%; border-radius:99px; transition:width .35s var(--ease);}
  .split-row .sv{width:70px; flex-shrink:0; text-align:right; font-family:var(--mono);
    font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}

  /* cartões */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px;
    margin-top:12px; overflow:hidden;}
  .card-top{display:flex; align-items:stretch;}
  .card-head{flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between;
    min-height:56px; padding:0 6px 0 16px; background:transparent; border:none;
    color:var(--text); font-family:var(--sans); text-align:left;}
  .card-head .hl{display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; min-width:0; font-family:var(--serif);}
  .card-head .hl span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-head .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .card-head .hr{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .card-head .sum{font-family:var(--mono); font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .card-head:focus-visible{outline:2px solid var(--accent); outline-offset:-3px; border-radius:16px;}
  .caret{color:var(--muted); transition:transform .25s var(--ease); flex-shrink:0;}
  .card.open .caret{transform:rotate(180deg);}

  .card-menu{width:var(--tap); flex-shrink:0; background:transparent; border:none;
    color:var(--muted-2); display:flex; align-items:center; justify-content:center;}
  .card-menu:active{color:var(--text);}
  .card-menu:focus-visible{outline:2px solid var(--accent); outline-offset:-4px; border-radius:12px;}

  .fold{display:grid; grid-template-rows:0fr; transition:grid-template-rows .26s var(--ease);}
  .card.open .fold{grid-template-rows:1fr;}
  .fold > .fold-in{overflow:hidden;}
  .list{list-style:none; margin:0; padding:0;}

  /* linhas */
  .row{position:relative; overflow:hidden;}
  .row + .row .row-main{border-top:1px solid var(--border);}
  .row-actions{position:absolute; top:0; right:0; bottom:0; width:var(--action-w);
    display:flex; align-items:stretch; visibility:hidden;}
  .row.swiping .row-actions{visibility:visible;}
  .row-actions button{flex:1; border:none; background:var(--danger); color:#fff;
    font-family:var(--sans); font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:5px;}
  .row-actions button:active{filter:brightness(.88);}

  /* espelho do painel de apagar: deslizar pra direita marca/desmarca */
  .row-check{position:absolute; top:0; left:0; bottom:0; width:var(--action-w);
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:var(--accent-ink); visibility:hidden;}
  .row-check.undo{background:var(--muted); color:#171209;}
  .row.swiping .row-check{visibility:visible;}
  .row-check svg{width:22px; height:22px;}

  .row-main{position:relative; z-index:1; background:var(--surface);
    display:flex; align-items:center; gap:12px; min-height:56px; padding:6px 16px;
    touch-action:pan-y;}
  .row.swiping .row-main{will-change:transform;}
  .row-main.animate{transition:transform .26s var(--ease);}
  .row-main.open::after{content:""; position:absolute; inset:0; z-index:5;}

  .check{position:relative; flex-shrink:0; width:24px; height:24px;
    border:2px solid var(--border); border-radius:8px; background:transparent;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:background .16s var(--ease), border-color .16s var(--ease), transform .1s var(--ease);}
  .check::before{content:""; position:absolute; top:50%; left:50%;
    width:var(--tap); height:var(--tap); transform:translate(-50%,-50%);}
  .check svg{width:14px; height:14px; opacity:0; transform:scale(.6);
    transition:opacity .16s var(--ease), transform .16s var(--ease);}
  .check[aria-checked="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .check[aria-checked="true"] svg{opacity:1; transform:scale(1);}
  .check:active{transform:scale(.9);}
  .check.pulse{animation:checkPulse .26s var(--ease);}
  @keyframes checkPulse{0%{transform:scale(1);}45%{transform:scale(1.3);}100%{transform:scale(1);}}
  .check:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  .row-name{flex:1; min-width:0; background:transparent; border:none; color:var(--text);
    font-family:var(--sans); font-size:16px; padding:9px 0; border-bottom:1px solid transparent;}
  .row-name:focus{outline:none; border-bottom-color:var(--accent);}
  .row-val{width:104px; flex-shrink:0; background:transparent; border:none; color:var(--text);
    font-family:var(--mono); font-size:16px; text-align:right;
    font-variant-numeric:tabular-nums; padding:9px 0; border-bottom:1px solid transparent;}
  .row-val:focus{outline:none; border-bottom-color:var(--accent); color:var(--accent);}
  .row.paid .row-name{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--muted-2);}
  .row.paid .row-val{color:var(--muted);}

  /* linha automática vinda da PJ */
  .row-auto{display:flex; align-items:center; gap:12px; min-height:56px; padding:6px 16px;
    border-top:1px solid var(--border); background:var(--surface);}
  .row-auto .ra-text{flex:1; min-width:0;}
  .row-auto .ra-text b{display:block; font-size:16px; font-weight:400;}
  .row-auto .ra-text small{display:block; color:var(--muted); font-size:11.5px; margin-top:2px;}
  .row-auto .ra-val{width:104px; flex-shrink:0; text-align:right; font-family:var(--mono);
    font-size:16px; font-variant-numeric:tabular-nums;}
  .row-auto.off .ra-text b, .row-auto.off .ra-val{color:var(--muted-2);}
  .tag{display:inline-block; font-family:var(--sans); font-size:10px; font-weight:800;
    letter-spacing:.6px; padding:2px 6px; border-radius:5px;
    background:var(--pj); color:var(--pj-ink); vertical-align:2px; margin-left:6px;}

  .row-kill{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);
    white-space:nowrap; border:0; padding:0;}
  .row-kill:focus-visible{position:static; width:auto; height:auto; clip:auto; overflow:visible;
    flex-shrink:0; background:var(--danger); color:#fff; border-radius:8px;
    padding:8px 12px; font-size:13px; font-weight:700; font-family:var(--sans);}

  .row-foot{padding:4px 16px 14px;}
  .add{display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
    min-height:var(--tap); background:transparent; border:1px dashed var(--border);
    border-radius:12px; color:var(--muted); font-size:14px; font-weight:600; font-family:var(--sans);}
  .add:active{background:var(--surface-2); color:var(--text);}
  .add:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .add.strong{margin-top:12px; min-height:52px; border-style:solid; border-color:var(--border);
    color:var(--text); font-size:15px; background:var(--surface);}

  .swipe-hint{display:flex; align-items:center; gap:6px; justify-content:center;
    color:var(--muted-2); font-size:11.5px; padding:2px 16px 10px;}

  /* taxas PJ */
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:18px;
    margin-top:12px; padding:4px 16px 12px;}
  .panel > h2, .receipt > h2{margin:14px 0 4px; font-size:11.5px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  .rate{display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:60px; border-top:1px solid var(--border);}
  .panel .rate:first-of-type{border-top:none;}
  .rate .rk{min-width:0;}
  .rate .rk b{display:block; font-size:15px; font-weight:600;}
  .rate .rk small{display:block; color:var(--muted); font-size:11.5px; margin-top:2px;}
  .field{display:flex; align-items:center; gap:2px; flex-shrink:0;
    width:104px; height:var(--tap); padding:0 12px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    transition:border-color .15s var(--ease);}
  .field:focus-within{border-color:var(--accent);}
  .field input{flex:1; min-width:0; background:transparent; border:none; color:var(--text);
    font-family:var(--mono); font-size:16px; text-align:right;
    font-variant-numeric:tabular-nums; padding:0;}
  .field input:focus{outline:none;}
  .field .unit{width:16px; flex-shrink:0; text-align:left; color:var(--muted);
    font-size:14px; font-family:var(--mono);}

  /* recibos */
  .receipt{background:var(--surface); border:1px solid var(--border); border-radius:18px;
    margin-top:12px; padding:4px 16px 14px;}
  .rline{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:9px 0; font-size:14.5px; border-top:1px dashed var(--border);}
  .receipt .rline:first-of-type{border-top:none;}
  .rline .rv{font-family:var(--mono); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .rline.calc .rk{color:var(--muted);}
  .rline.tot{font-weight:700; border-top:1px solid var(--border); margin-top:2px; padding-top:12px;}
  .rline.tot .rv{color:var(--accent);}
  .rline.out .rv{color:var(--muted);}
  .note-in{color:var(--muted-2); font-size:11.5px; line-height:1.55; padding:10px 0 2px;
    border-top:1px dashed var(--border); margin-top:4px;}

  /* barra Concluir */
  .kb{position:fixed; left:0; right:0; bottom:0; z-index:60; display:none;
    justify-content:flex-end; align-items:center;
    padding:8px 16px calc(8px + env(safe-area-inset-bottom));
    background:var(--surface-2); border-top:1px solid var(--border);}
  .kb.show{display:flex;}
  .kb button{min-height:38px; padding:0 20px; border:none; border-radius:10px;
    background:var(--accent); color:var(--accent-ink);
    font-family:var(--sans); font-size:15px; font-weight:700;}

  /* aviso desfazer */
  .toast{position:fixed; left:16px; right:16px; z-index:90;
    bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-3); border:1px solid var(--border);
    border-radius:14px; padding:12px 12px 12px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transform:translateY(160%); transition:transform .3s var(--ease);
    max-width:508px; margin:0 auto;}
  .toast.show{transform:translateY(0);}
  .toast[hidden]{display:none;}
  .toast span{font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .toast button{flex-shrink:0; min-height:36px; padding:0 14px; border-radius:9px; border:none;
    background:var(--accent); color:var(--accent-ink);
    font-family:var(--sans); font-size:14px; font-weight:700;}

  /* painel de edição de seção */
  .scrim{position:fixed; inset:0; z-index:80; background:rgba(4,8,16,.65);
    opacity:0; transition:opacity .25s var(--ease);}
  .scrim.show{opacity:1;}
  .scrim[hidden]{display:none;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:81;
    background:var(--surface); border-top:1px solid var(--border);
    border-radius:22px 22px 0 0; max-width:540px; margin:0 auto;
    padding:8px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .28s var(--ease);}
  .sheet.show{transform:translateY(0);}
  .sheet[hidden]{display:none;}
  .grip{width:38px; height:4px; border-radius:99px; background:var(--border); margin:2px auto 14px;}
  .sheet h2{margin:0 0 14px; font-size:18px; font-weight:600; font-family:var(--serif);}
  .sheet label.lbl{display:block; color:var(--muted); font-size:11.5px; font-weight:700;
    letter-spacing:.8px; text-transform:uppercase; margin:0 0 7px;}
  .sheet-input{width:100%; height:50px; padding:0 14px; border-radius:12px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-family:var(--sans); font-size:16px;}
  .sheet-input:focus{outline:none; border-color:var(--accent);}
  .swatches{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:4px;}
  .sw{width:var(--tap); height:var(--tap); border-radius:14px; border:2px solid transparent;
    background:transparent; display:flex; align-items:center; justify-content:center; padding:0;}
  .sw i{display:block; width:26px; height:26px; border-radius:50%;}
  .sw[aria-pressed="true"]{border-color:var(--text);}
  .sheet-btns{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
  .btn{min-height:50px; border-radius:13px; border:none; font-family:var(--sans);
    font-size:16px; font-weight:700;}
  .btn-main{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(255,92,92,.35);}
  .btn-danger.armed{background:var(--danger); color:#fff; border-color:var(--danger);}

  footer.note{text-align:center; color:var(--muted-2); font-size:11.5px;
    margin-top:24px; line-height:1.6; padding:0 12px;}

  @media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important;}}
</style>
</head>
<body>
<div class="app" id="app" data-view="pf"></div>

<div class="kb" id="kb"><button type="button" id="kbDone">Concluir</button></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Desfazer</button></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Editar seção"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
   * ARMAZENAMENTO
   * ========================================================= */
  const KEY = "financas-pf-pj-v1";
  let mem = null;

  async function load(){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(KEY, false);
        return (r && r.value) ? JSON.parse(r.value) : null;
      }
    }catch(e){}
    try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return mem;
  }
  let saveT = null;
  function save(){
    mem = state;
    clearTimeout(saveT);
    saveT = setTimeout(async ()=>{
      const j = JSON.stringify(state);
      try{ if(window.storage && window.storage.set){ await window.storage.set(KEY, j, false); return; } }catch(e){}
      try{ localStorage.setItem(KEY, j); }catch(e){}
    }, 200);
  }
  const uid = ()=> Math.random().toString(36).slice(2,9);

  const CORES = ["#6FAE87","#6F93B8","#C99A3E","#C1543C","#8B7BB0","#5FA3A3","#8FA05C","#B6795A"];

  /* ============================================================
   * ESTADO
   * ========================================================= */
  function seed(){
    return {
      view:"pf", hintSeen:false,
      pf:{
        rendas:[{id:uid(), name:"Salário líquido", valor:9300}],
        incluirProLabore:true,
        open:{__rendas:true, fixas:true, assinaturas:true, investimentos:true, cartao:true},
        categories:[
          {id:"fixas", name:"Contas Fixas", color:"#6FAE87", items:[
            {id:uid(), name:"Dass", valor:0, pago:true},
            {id:uid(), name:"Apartamento", valor:1560, pago:false},
            {id:uid(), name:"Ajuda em casa", valor:700, pago:false},
            {id:uid(), name:"Inglês", valor:0, pago:false}]},
          {id:"assinaturas", name:"Assinaturas", color:"#6F93B8", items:[
            {id:uid(), name:"Claude", valor:109, pago:false},
            {id:uid(), name:"YouTube", valor:24, pago:false},
            {id:uid(), name:"iCloud", valor:9, pago:false},
            {id:uid(), name:"HBO Max", valor:23, pago:false},
            {id:uid(), name:"iFood", valor:8, pago:false},
            {id:uid(), name:"Tim", valor:60, pago:false},
            {id:uid(), name:"Apple", valor:20, pago:false},
            {id:uid(), name:"Hostinger", valor:0, pago:false}]},
          {id:"investimentos", name:"Investimentos", color:"#C99A3E", items:[
            {id:uid(), name:"Bolão 2026", valor:250, pago:true},
            {id:uid(), name:"Férias", valor:500, pago:true},
            {id:uid(), name:"Reserva de emergência", valor:500, pago:true}]},
          {id:"cartao", name:"Cartão de Crédito", color:"#C1543C", items:[
            {id:uid(), name:"Itaú", valor:1763, pago:false},
            {id:uid(), name:"Nubank", valor:500, pago:false}]},
        ]
      },
      pj:{
        faturamento:2739.13,
        taxaProLabore:0.28, taxaDAS:0.06, taxaINSS:0.11,
        open:{fixas:true, variaveis:true},
        categories:[
          {id:"fixas", name:"Custos fixos", color:"#C99A3E", items:[{id:uid(), name:"Contador", valor:250, pago:false}]},
          {id:"variaveis", name:"Variáveis", color:"#6F93B8", items:[{id:uid(), name:"Abertura ME", valor:250, pago:false}]},
        ]
      }
    };
  }

  function migrate(s){
    if(!s || !s.pf || !s.pj) return seed();

    // salário único -> lista de receitas
    if(!Array.isArray(s.pf.rendas)){
      s.pf.rendas = [{id:uid(), name:"Salário líquido", valor: s.pf.salario != null ? s.pf.salario : 0}];
    }
    delete s.pf.salario;
    if(typeof s.pf.incluirProLabore !== "boolean") s.pf.incluirProLabore = true;
    if(!s.pf.open) s.pf.open = {};
    if(s.pf.open.__rendas === undefined) s.pf.open.__rendas = true;
    if(!Array.isArray(s.pf.categories)) s.pf.categories = [];

    // listas fixas do PJ -> seções editáveis
    if(!Array.isArray(s.pj.categories)){
      s.pj.categories = [];
      const fixas = Array.isArray(s.pj.fixas) ? s.pj.fixas
                  : (s.pj.contador != null ? [{id:uid(), name:"Contador", valor:s.pj.contador}] : []);
      s.pj.categories.push({id:"fixas", name:"Custos fixos", color:"#C99A3E", items:fixas});
      s.pj.categories.push({id:"variaveis", name:"Variáveis", color:"#6F93B8",
                            items: Array.isArray(s.pj.variaveis) ? s.pj.variaveis : []});
    }
    delete s.pj.fixas; delete s.pj.variaveis; delete s.pj.contador;
    if(!s.pj.open) s.pj.open = {};
    if(typeof s.hintSeen !== "boolean") s.hintSeen = false;

    // garante id e cor em toda seção, e o campo "pago" em toda despesa
    // (o PJ passou a ter check também — dados salvos antes disso não tinham o campo)
    [s.pf, s.pj].forEach(b=>{
      b.categories.forEach((c,i)=>{
        if(!c.id) c.id = uid();
        if(!c.color) c.color = CORES[i % CORES.length];
        if(!Array.isArray(c.items)) c.items = [];
        c.items.forEach(it=>{ if(typeof it.pago !== "boolean") it.pago = false; });
      });
    });
    return s;
  }

  let state = null;

  /* ============================================================
   * CÁLCULOS
   *
   * O INSS de 11% é RETIDO de dentro do pró-labore bruto: a empresa
   * paga 682,59 ao sócio e 84,37 ao governo, somando o bruto de 766,96.
   * Por isso o INSS NÃO entra outra vez como despesa — a planilha
   * original fazia isso e descontava o INSS duas vezes.
   *
   * O pró-labore líquido sai da PJ e entra como receita na PF.
   * ========================================================= */
  const fmt = n => (Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
  const sum = a => a.reduce((s,i)=> s + (Number(i.valor)||0), 0);

  function calcPJ(pj){
    const fat      = Number(pj.faturamento)||0;
    const proBruto = fat * (Number(pj.taxaProLabore)||0);
    const das      = fat * (Number(pj.taxaDAS)||0);
    const inss     = proBruto * (Number(pj.taxaINSS)||0);
    const proLiq   = proBruto - inss;
    const cats     = pj.categories.map(c=>({id:c.id, name:c.name, color:c.color, total:sum(c.items)}));
    const outras   = cats.reduce((s,c)=>s+c.total,0);
    const saidas   = proBruto + das + outras;
    return {fat, proBruto, das, inss, proLiq, cats, outras, saidas, restante: fat - saidas};
  }

  function calcPF(pf, pjr){
    const base     = sum(pf.rendas);
    const extra    = pf.incluirProLabore ? pjr.proLiq : 0;
    const receitas = base + extra;
    const cats     = pf.categories.map(c=>({id:c.id, name:c.name, color:c.color, total:sum(c.items)}));
    const despesas = cats.reduce((s,c)=>s+c.total,0);
    const n        = pf.categories.reduce((s,c)=>s+c.items.length,0);
    const pagos    = pf.categories.reduce((s,c)=>s+c.items.filter(i=>i.pago).length,0);
    return {base, extra, receitas, cats, despesas, restante: receitas - despesas, n, pagos};
  }

  /* ============================================================
   * ÍCONES
   * ========================================================= */
  const ico = {
    check:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    caret:'<svg class="caret" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    pencil:'<svg class="edit-hint" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4.6c0-.4.3-.6.7-.6h4.6c.4 0 .7.2.7.6V7M17.5 7l-.7 12c0 .8-.7 1.5-1.5 1.5H8.7c-.8 0-1.5-.7-1.5-1.5L6.5 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    swipe:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    uncheck:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
    dots: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
  };
  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

  /* ============================================================
   * RENDER
   * ========================================================= */
  const app = document.getElementById("app");

  function rowHTML(scope, listId, it, checkable){
    return `
    <li class="row ${checkable && it.pago ? 'paid':''}" data-scope="${scope}" data-list="${listId}" data-id="${it.id}"
        data-checkable="${checkable ? 'true':'false'}">
      ${checkable ? `<div class="row-check ${it.pago ? 'undo':''}" aria-hidden="true">${it.pago ? ico.uncheck : ico.check}</div>` : ``}
      <div class="row-actions">
        <button type="button" data-act="del" data-scope="${scope}" data-list="${listId}" data-id="${it.id}"
                aria-label="Apagar ${esc(it.name)}">${ico.trash} Apagar</button>
      </div>
      <div class="row-main">
        ${checkable ? `<button type="button" class="check" role="checkbox" aria-checked="${it.pago?'true':'false'}"
          data-act="pay" data-scope="${scope}" data-list="${listId}" data-id="${it.id}"
          aria-label="Marcar ${esc(it.name)} como paga">${ico.check}</button>` : ``}
        <input class="row-name" value="${esc(it.name)}" placeholder="Nome do item" enterkeyhint="done"
               aria-label="Nome" data-act="name" data-scope="${scope}" data-list="${listId}" data-id="${it.id}">
        <input class="row-val" value="${fmt(it.valor)}" inputmode="decimal" aria-label="Valor em reais"
               data-act="val" data-scope="${scope}" data-list="${listId}" data-id="${it.id}">
        <button type="button" class="row-kill" data-act="del" data-scope="${scope}" data-list="${listId}" data-id="${it.id}">Apagar</button>
      </div>
    </li>`;
  }

  function cardHTML(o){
    return `
    <section class="card ${o.open?'open':''}">
      <div class="card-top">
        <button type="button" class="card-head" data-act="fold" data-scope="${o.scope}" data-list="${o.id}"
                aria-expanded="${o.open?'true':'false'}">
          <span class="hl"><span class="dot" style="background:${o.color}"></span><span>${esc(o.name)}</span></span>
          <span class="hr"><span class="sum" data-sum="${o.scope}:${o.id}">R$ ${fmt(o.total)}</span>${ico.caret}</span>
        </button>
        ${o.fixed ? `` : `<button type="button" class="card-menu" data-act="sect"
            data-scope="${o.scope}" data-list="${o.id}" aria-label="Opções da seção ${esc(o.name)}">${ico.dots}</button>`}
      </div>
      <div class="fold"><div class="fold-in">
        <ul class="list">${o.items.map(it=>rowHTML(o.scope,o.id,it,o.checkable)).join("")}</ul>
        ${o.extraRow || ``}
        ${o.hint ? `<p class="swipe-hint">${ico.swipe} Deslize um item: esquerda apaga, direita marca como paga</p>` : ``}
        <div class="row-foot">
          <button type="button" class="add" data-act="add" data-scope="${o.scope}" data-list="${o.id}">
            ${ico.plus} Adicionar item
          </button>
        </div>
      </div></div>
    </section>`;
  }

  function viewPF(){
    const pf = state.pf, pjr = calcPJ(state.pj), c = calcPF(pf, pjr);
    const pct = Math.min(100, (c.despesas/(c.receitas||1))*100);
    const pagoPct = c.n ? Math.round((c.pagos/c.n)*100) : 0;

    const proRow = `
      <div class="row-auto ${pf.incluirProLabore?'':'off'}">
        <button type="button" class="check" role="checkbox" aria-checked="${pf.incluirProLabore?'true':'false'}"
                data-act="toggle-pro" aria-label="Somar o pró-labore às receitas">${ico.check}</button>
        <span class="ra-text">
          <b>Pró-labore<span class="tag">PJ</span></b>
          <small>líquido, já com o INSS retido · calculado na aba PJ</small>
        </span>
        <span class="ra-val" data-out="pf-pro">${fmt(pjr.proLiq)}</span>
      </div>`;

    return `
    <section class="summary">
      <div class="sum-line">
        <span class="k">Receitas</span>
        <span class="v" data-out="pf-receitas">R$ ${fmt(c.receitas)}</span>
      </div>
      <div class="sum-line">
        <span class="k">Despesas</span>
        <span class="v muted" data-out="pf-despesas">R$ ${fmt(c.despesas)}</span>
      </div>
      <div class="perf"></div>
      <div class="hero">
        <div class="k">Restante do mês</div>
        <div class="v ${c.restante>=0?'pos':'neg'}" data-out="pf-restante">R$ ${fmt(c.restante)}</div>
      </div>
      <div class="meter"><i data-out="pf-meter" class="${pct>=100?'over':''}" style="width:${pct}%"></i></div>
      <div class="stats">
        <span>Comprometido: <b data-out="pf-pct">${Math.round(pct)}%</b></span>
        <span data-out="pf-pagos"><b>${c.pagos}/${c.n}</b> pagas (${pagoPct}%)</span>
      </div>
      <div class="split">
        ${c.cats.map(ct=>{
          const w = c.despesas ? (ct.total/c.despesas)*100 : 0;
          return `<div class="split-row" data-split="${ct.id}">
            <span class="sk">${esc(ct.name)}</span>
            <span class="split-track"><i style="width:${w}%;background:${ct.color}"></i></span>
            <span class="sv">${fmt(ct.total)}</span></div>`;
        }).join("")}
      </div>
    </section>

    ${cardHTML({scope:"pf", id:"__rendas", name:"Receitas", color:"#6FAE87",
                items:pf.rendas, total:c.receitas, open:!!pf.open.__rendas,
                checkable:false, fixed:true, extraRow:proRow})}

    ${pf.categories.map((cat,i)=>cardHTML({
      scope:"pf", id:cat.id, name:cat.name, color:cat.color, items:cat.items,
      total:sum(cat.items), open:!!pf.open[cat.id], checkable:true,
      hint: i===0 && !state.hintSeen
    })).join("")}

    <button type="button" class="add strong" data-act="new-sect" data-scope="pf">
      ${ico.plus} Nova seção de despesa
    </button>`;
  }

  function viewPJ(){
    const pj = state.pj, c = calcPJ(pj);
    return `
    <section class="summary">
      <div class="sum-line">
        <span class="k">Faturamento</span>
        <label class="inline-field">
          <span class="pre">R$</span>
          <input inputmode="decimal" value="${fmt(pj.faturamento)}" aria-label="Faturamento" data-act="faturamento">
          ${ico.pencil}
        </label>
      </div>
      <div class="sum-line">
        <span class="k">Saídas</span>
        <span class="v muted" data-out="pj-saidas">R$ ${fmt(c.saidas)}</span>
      </div>
      <div class="perf"></div>
      <div class="hero">
        <div class="k">Restante na empresa</div>
        <div class="v ${c.restante>=0?'pos':'neg'}" data-out="pj-restante">R$ ${fmt(c.restante)}</div>
      </div>
      <div class="stats">
        <span>Vai para a PF: <b data-out="pj-paraPf">R$ ${fmt(c.proLiq)}</b></span>
        <span>Impostos: <b data-out="pj-impostos">R$ ${fmt(c.das + c.inss)}</b></span>
      </div>
    </section>

    <section class="panel">
      <h2>Taxas de cálculo</h2>
      ${[["taxaProLabore","Pró-labore","sobre o faturamento"],
         ["taxaDAS","Guia DAS","sobre o faturamento"],
         ["taxaINSS","Guia INSS","retido do pró-labore"]].map(([k,label,sub])=>`
        <div class="rate">
          <span class="rk"><b>${label}</b><small>${sub}</small></span>
          <label class="field">
            <input inputmode="decimal" value="${(pj[k]*100).toFixed(1).replace('.',',')}"
                   aria-label="${label} em porcento" data-act="taxa" data-taxa="${k}">
            <span class="unit">%</span>
          </label>
        </div>`).join("")}
    </section>

    <section class="receipt">
      <h2>Pró-labore</h2>
      <div class="rline calc"><span class="rk">Bruto</span><span class="rv" data-out="pj-proBruto">R$ ${fmt(c.proBruto)}</span></div>
      <div class="rline calc"><span class="rk">INSS retido</span><span class="rv" data-out="pj-inss">− R$ ${fmt(c.inss)}</span></div>
      <div class="rline tot"><span class="rk">Líquido → entra na PF</span><span class="rv" data-out="pj-proLiq">R$ ${fmt(c.proLiq)}</span></div>
      <p class="note-in">O INSS é descontado de dentro do pró-labore: a empresa paga
        R$ ${fmt(c.proLiq)} a você e R$ ${fmt(c.inss)} ao governo, somando o bruto.
        Por isso ele não entra outra vez como despesa.</p>
    </section>

    ${pj.categories.map(cat=>cardHTML({
      scope:"pj", id:cat.id, name:cat.name, color:cat.color, items:cat.items,
      total:sum(cat.items), open:!!pj.open[cat.id], checkable:true
    })).join("")}

    <button type="button" class="add strong" data-act="new-sect" data-scope="pj">
      ${ico.plus} Nova seção de custo
    </button>

    <section class="receipt">
      <h2>Saídas da empresa</h2>
      <div class="rline out"><span class="rk">Pró-labore bruto</span><span class="rv" data-out="pj-o1">− R$ ${fmt(c.proBruto)}</span></div>
      <div class="rline out"><span class="rk">Guia DAS</span><span class="rv" data-out="pj-o2">− R$ ${fmt(c.das)}</span></div>
      ${c.cats.map(ct=>`<div class="rline out"><span class="rk">${esc(ct.name)}</span>
        <span class="rv" data-oc="${ct.id}">− R$ ${fmt(ct.total)}</span></div>`).join("")}
      <div class="rline tot"><span class="rk">Restante na empresa</span><span class="rv" data-out="pj-rest2">R$ ${fmt(c.restante)}</span></div>
    </section>`;
  }

  function render(){
    let mes = new Date().toLocaleDateString("pt-BR",{month:"long", year:"numeric"});
    mes = mes.charAt(0).toUpperCase() + mes.slice(1);
    app.dataset.view = state.view;
    app.innerHTML = `
      <header class="top">
        <div class="brand"><h1>Finanças</h1><span class="month">${mes}</span></div>
        <div class="switch" role="tablist" aria-label="Tipo de conta">
          <button type="button" role="tab" class="stamp" aria-selected="${state.view==='pf'}" data-act="view" data-view="pf">Pessoa<br>Física</button>
          <button type="button" role="tab" class="stamp" aria-selected="${state.view==='pj'}" data-act="view" data-view="pj">Pessoa<br>Jurídica</button>
        </div>
      </header>
      <main>${state.view==="pf" ? viewPF() : viewPJ()}</main>
      <footer class="note">Os dados ficam salvos apenas neste aparelho.</footer>`;
    openRow = null;
  }

  /* ============================================================
   * ATUALIZAR TOTAIS SEM RE-RENDER
   * ========================================================= */
  const out = k => app.querySelector(`[data-out="${k}"]`);
  const setTxt = (k,v)=>{ const e=out(k); if(e) e.textContent = v; };

  function refresh(){
    const pjr = calcPJ(state.pj);
    if(state.view === "pf"){
      const pf = state.pf, c = calcPF(pf, pjr);
      const rs = app.querySelector('[data-sum="pf:__rendas"]');
      if(rs) rs.textContent = "R$ " + fmt(c.receitas);
      pf.categories.forEach(cat=>{
        const el = app.querySelector(`[data-sum="pf:${cat.id}"]`);
        if(el) el.textContent = "R$ " + fmt(sum(cat.items));
      });
      setTxt("pf-receitas","R$ "+fmt(c.receitas));
      setTxt("pf-despesas","R$ "+fmt(c.despesas));
      setTxt("pf-pro", fmt(pjr.proLiq));
      const r = out("pf-restante");
      if(r){ r.textContent = "R$ "+fmt(c.restante); r.className = "v "+(c.restante>=0?"pos":"neg"); }
      const pct = Math.min(100,(c.despesas/(c.receitas||1))*100);
      const m = out("pf-meter"); if(m){ m.style.width = pct+"%"; m.classList.toggle("over", pct>=100); }
      setTxt("pf-pct", Math.round(pct)+"%");
      const pg = out("pf-pagos");
      if(pg) pg.innerHTML = `<b>${c.pagos}/${c.n}</b> pagas (${c.n?Math.round((c.pagos/c.n)*100):0}%)`;
      c.cats.forEach(ct=>{
        const row = app.querySelector(`[data-split="${ct.id}"]`);
        if(!row) return;
        row.querySelector("i").style.width = (c.despesas ? (ct.total/c.despesas)*100 : 0)+"%";
        row.querySelector(".sv").textContent = fmt(ct.total);
      });
    } else {
      const c = pjr;
      setTxt("pj-saidas","R$ "+fmt(c.saidas));
      const r = out("pj-restante");
      if(r){ r.textContent = "R$ "+fmt(c.restante); r.className = "v "+(c.restante>=0?"pos":"neg"); }
      setTxt("pj-paraPf","R$ "+fmt(c.proLiq));
      setTxt("pj-impostos","R$ "+fmt(c.das + c.inss));
      setTxt("pj-proBruto","R$ "+fmt(c.proBruto));
      setTxt("pj-inss","− R$ "+fmt(c.inss));
      setTxt("pj-proLiq","R$ "+fmt(c.proLiq));
      setTxt("pj-o1","− R$ "+fmt(c.proBruto));
      setTxt("pj-o2","− R$ "+fmt(c.das));
      setTxt("pj-rest2","R$ "+fmt(c.restante));
      c.cats.forEach(ct=>{
        const el = app.querySelector(`[data-sum="pj:${ct.id}"]`);
        if(el) el.textContent = "R$ " + fmt(ct.total);
        const oc = app.querySelector(`[data-oc="${ct.id}"]`);
        if(oc) oc.textContent = "− R$ " + fmt(ct.total);
      });
    }
  }

  /* ============================================================
   * ACESSO A LISTAS E SEÇÕES
   * ========================================================= */
  function listOf(scope, listId){
    if(scope === "pf" && listId === "__rendas") return state.pf.rendas;
    const cat = state[scope].categories.find(c=>c.id===listId);
    return cat ? cat.items : null;
  }
  const sectOf = (scope, listId)=> state[scope].categories.find(c=>c.id===listId);
  function itemOf(scope, listId, id){
    const l = listOf(scope, listId);
    return l ? l.find(i=>i.id===id) : null;
  }

  function parseNum(v){
    if(typeof v !== "string") return Number(v)||0;
    let s = v.trim().replace(/\s/g,"");
    if(s.indexOf(",") > -1){ s = s.replace(/\./g,"").replace(",","."); }
    else{
      const dots = (s.match(/\./g)||[]).length;
      if(dots > 1 || (dots === 1 && /\.\d{3}$/.test(s))) s = s.replace(/\./g,"");
    }
    s = s.replace(/[^0-9.\-]/g,"");
    const n = Number(s);
    return isFinite(n) ? n : 0;
  }

  /* ============================================================
   * DESLIZAR PARA APAGAR (esquerda) E MARCAR/DESMARCAR (direita)
   * ========================================================= */
  const ACTION_W = 92;
  const CHECK_TRIGGER = 56;   // distância pra direita que já dispara o toggle
  let drag = null, openRow = null;
  const offOf = el => Number(el.dataset.off || 0);
  function setOff(el,x){ el.dataset.off = x; el.style.transform = "translateX("+x+"px)"; }
  function closeRow(el, animate){
    if(!el) return;
    if(animate !== false) el.classList.add("animate");
    setOff(el,0); el.classList.remove("open");
    const row = el.closest(".row");
    if(row) setTimeout(()=>{ if(offOf(el)===0) row.classList.remove("swiping"); }, 280);
    if(openRow === el) openRow = null;
  }

  function toggleBySwipe(main){
    const row = main.closest(".row");
    if(!row) return;
    const {scope, list, id} = row.dataset;
    const it = itemOf(scope, list, id);
    if(!it) return;
    it.pago = !it.pago; save();
    row.classList.toggle("paid", it.pago);
    const chk = main.querySelector('.check[data-act="pay"]');
    if(chk){
      chk.setAttribute("aria-checked", it.pago ? "true":"false");
      chk.classList.add("pulse");
      setTimeout(()=> chk.classList.remove("pulse"), 260);
    }
    const rc = row.querySelector(".row-check");
    if(rc){ rc.classList.toggle("undo", it.pago); rc.innerHTML = it.pago ? ico.uncheck : ico.check; }
    refresh();
  }

  app.addEventListener("touchstart", e=>{
    const main = e.target.closest(".row-main");
    const touchedRow = e.target.closest(".row");
    const openRowEl = openRow ? openRow.closest(".row") : null;
    // só fecha se o toque foi em OUTRA linha — tocar no botão "Apagar"
    // da própria linha aberta não deve fechá-la antes do clique acontecer
    if(openRow && touchedRow !== openRowEl) closeRow(openRow);
    if(!main) return;
    const checkable = touchedRow ? touchedRow.dataset.checkable === "true" : false;
    drag = {main, x:e.touches[0].clientX, y:e.touches[0].clientY, start:offOf(main), dir:null, checkable};
    main.classList.remove("animate");
  }, {passive:true});

  app.addEventListener("touchmove", e=>{
    if(!drag) return;
    const dx = e.touches[0].clientX - drag.x;
    const dy = e.touches[0].clientY - drag.y;
    if(!drag.dir){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      drag.dir = Math.abs(dx) > Math.abs(dy)*1.15 ? "h" : "v";
      if(drag.dir === "h"){
        const row = drag.main.closest(".row");
        if(row) row.classList.add("swiping");
        if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
      }
    }
    if(drag.dir !== "h") return;
    e.preventDefault();
    let x = drag.start + dx;
    if(x > 0){
      if(drag.checkable) { if(x > ACTION_W) x = ACTION_W + (x-ACTION_W)*0.25; }
      else x *= 0.2;                                            // não marcável: só um elástico, sem ação
    }
    if(x < -ACTION_W) x = -ACTION_W + (x + ACTION_W)*0.25;
    setOff(drag.main, x);
  }, {passive:false});

  function endDrag(){
    if(!drag) return;
    const d = drag; drag = null;
    if(d.dir !== "h") return;
    d.main.classList.add("animate");
    const x = offOf(d.main);
    if(d.checkable && x > CHECK_TRIGGER){
      toggleBySwipe(d.main);
      closeRow(d.main);
    } else if(x < -ACTION_W*0.4){
      setOff(d.main, -ACTION_W); d.main.classList.add("open"); openRow = d.main;
      if(!state.hintSeen){
        state.hintSeen = true; save();
        const h = app.querySelector(".swipe-hint"); if(h) h.remove();
      }
    } else closeRow(d.main);
  }
  app.addEventListener("touchend", endDrag, {passive:true});
  app.addEventListener("touchcancel", endDrag, {passive:true});
  document.addEventListener("touchstart", e=>{
    if(openRow && !e.target.closest(".row")) closeRow(openRow);
  }, {passive:true});

  /* ============================================================
   * APAGAR COM DESFAZER  (item ou seção inteira)
   * ========================================================= */
  const toast = document.getElementById("toast");
  const toastMsg = document.getElementById("toastMsg");
  let trash = null, toastT = null;

  function hideToast(){
    toast.classList.remove("show");
    clearTimeout(toastT);
    toastT = setTimeout(()=>{ toast.hidden = true; trash = null; }, 340);
  }
  function showToast(msg){
    toastMsg.textContent = msg;
    toast.hidden = false;
    requestAnimationFrame(()=> toast.classList.add("show"));
    clearTimeout(toastT);
    toastT = setTimeout(hideToast, 5000);
  }

  // arrastar o aviso pra baixo fecha na hora, sem esperar os 5s
  (function toastSwipe(){
    let sy=0, moved=false, active=false;
    toast.addEventListener("touchstart", e=>{
      active = true; moved = false; sy = e.touches[0].clientY;
      toast.style.transition = "none";
    }, {passive:true});
    toast.addEventListener("touchmove", e=>{
      if(!active) return;
      const dy = e.touches[0].clientY - sy;
      if(dy > 6) moved = true;
      if(moved) toast.style.transform = `translateY(${Math.max(0,dy)}px)`;
    }, {passive:true});
    function end(e){
      if(!active) return;
      active = false;
      toast.style.transition = "";
      const dy = (e.changedTouches ? e.changedTouches[0].clientY : sy) - sy;
      toast.style.transform = "";
      if(moved && dy > 46) hideToast();
    }
    toast.addEventListener("touchend", end, {passive:true});
    toast.addEventListener("touchcancel", end, {passive:true});
  })();

  function removeItem(scope, listId, id){
    const list = listOf(scope, listId);
    if(!list) return;
    const idx = list.findIndex(i=>i.id===id);
    if(idx < 0) return;
    trash = {kind:"item", scope, listId, idx, data:list[idx]};
    list.splice(idx,1);
    save(); render();
    showToast(`"${trash.data.name || "Item"}" apagado`);
  }

  function removeSection(scope, listId){
    const cats = state[scope].categories;
    const idx = cats.findIndex(c=>c.id===listId);
    if(idx < 0) return;
    trash = {kind:"sect", scope, idx, data:cats[idx]};
    cats.splice(idx,1);
    delete state[scope].open[listId];
    save(); render();
    showToast(`Seção "${trash.data.name || "sem nome"}" apagada`);
  }

  document.getElementById("toastUndo").addEventListener("click", ()=>{
    if(!trash) return;
    if(trash.kind === "item"){
      const l = listOf(trash.scope, trash.listId);
      if(l) l.splice(Math.min(trash.idx, l.length), 0, trash.data);
    } else {
      const cats = state[trash.scope].categories;
      cats.splice(Math.min(trash.idx, cats.length), 0, trash.data);
      state[trash.scope].open[trash.data.id] = true;
    }
    save(); render(); hideToast();
  });

  /* ============================================================
   * PAINEL DE SEÇÃO (criar / renomear / cor / apagar)
   * ========================================================= */
  const scrim = document.getElementById("scrim");
  const sheet = document.getElementById("sheet");
  let sheetCtx = null;

  function openSheet(scope, listId, isNew){
    const cat = sectOf(scope, listId);
    if(!cat) return;
    sheetCtx = {scope, listId, isNew, armed:false};
    sheet.innerHTML = `
      <div class="grip"></div>
      <h2>${isNew ? "Nova seção" : "Editar seção"}</h2>
      <label class="lbl" for="secName">Nome</label>
      <input class="sheet-input" id="secName" value="${esc(cat.name)}"
             placeholder="Ex.: Transporte" enterkeyhint="done" maxlength="40">
      <label class="lbl" style="margin-top:18px">Cor</label>
      <div class="swatches">
        ${CORES.map(cor=>`<button type="button" class="sw" data-cor="${cor}"
          aria-pressed="${cor.toLowerCase()===String(cat.color).toLowerCase()}"
          aria-label="Cor ${cor}"><i style="background:${cor}"></i></button>`).join("")}
      </div>
      <div class="sheet-btns">
        <button type="button" class="btn btn-main" data-sheet="done">Concluir</button>
        ${isNew ? `<button type="button" class="btn btn-ghost" data-sheet="cancel">Cancelar</button>`
                : `<button type="button" class="btn btn-danger" data-sheet="del">Apagar seção</button>`}
      </div>`;
    scrim.hidden = false; sheet.hidden = false;
    requestAnimationFrame(()=>{ scrim.classList.add("show"); sheet.classList.add("show"); });
    const inp = sheet.querySelector("#secName");
    if(isNew) setTimeout(()=>{ inp.focus(); }, 320);
  }

  function closeSheet(){
    scrim.classList.remove("show"); sheet.classList.remove("show");
    setTimeout(()=>{ scrim.hidden = true; sheet.hidden = true; sheetCtx = null; }, 300);
  }

  sheet.addEventListener("click", e=>{
    if(!sheetCtx) return;
    const sw = e.target.closest(".sw");
    if(sw){
      const cat = sectOf(sheetCtx.scope, sheetCtx.listId);
      if(cat){ cat.color = sw.dataset.cor; save(); }
      sheet.querySelectorAll(".sw").forEach(b=> b.setAttribute("aria-pressed", b===sw ? "true":"false"));
      return;
    }
    const btn = e.target.closest("[data-sheet]");
    if(!btn) return;
    const act = btn.dataset.sheet;

    if(act === "done"){
      const cat = sectOf(sheetCtx.scope, sheetCtx.listId);
      const nome = sheet.querySelector("#secName").value.trim();
      if(cat) cat.name = nome || "Sem nome";
      save(); closeSheet(); render(); return;
    }
    if(act === "cancel"){
      removeSectionSilently(sheetCtx.scope, sheetCtx.listId);
      closeSheet(); render(); return;
    }
    if(act === "del"){
      if(!sheetCtx.armed){                      // dois toques: evita apagar sem querer
        sheetCtx.armed = true;
        btn.classList.add("armed");
        btn.textContent = "Confirmar exclusão";
        return;
      }
      const {scope, listId} = sheetCtx;
      closeSheet();
      removeSection(scope, listId);
      return;
    }
  });

  function removeSectionSilently(scope, listId){
    const cats = state[scope].categories;
    const i = cats.findIndex(c=>c.id===listId);
    if(i > -1) cats.splice(i,1);
    delete state[scope].open[listId];
    save();
  }

  // fecha salvando o nome digitado até então — usado ao tocar fora ou ao arrastar pra baixo
  function dismissSheet(){
    if(sheetCtx){
      const nome = sheet.querySelector("#secName");
      const cat = sectOf(sheetCtx.scope, sheetCtx.listId);
      if(cat && nome) cat.name = nome.value.trim() || "Sem nome";
      save();
    }
    closeSheet(); render();
  }
  scrim.addEventListener("click", dismissSheet);

  // arrastar a folha pra baixo fecha — não inicia sobre campo, botão ou cor
  (function sheetSwipe(){
    let sy=0, moved=false, active=false;
    sheet.addEventListener("touchstart", e=>{
      if(e.target.closest("input, button, .sw")) return;
      active = true; moved = false; sy = e.touches[0].clientY;
      sheet.style.transition = "none";
    }, {passive:true});
    sheet.addEventListener("touchmove", e=>{
      if(!active) return;
      const dy = e.touches[0].clientY - sy;
      if(dy > 6) moved = true;
      if(moved) sheet.style.transform = `translateY(${Math.max(0,dy)}px)`;
    }, {passive:true});
    function end(e){
      if(!active) return;
      active = false;
      sheet.style.transition = "";
      const dy = (e.changedTouches ? e.changedTouches[0].clientY : sy) - sy;
      sheet.style.transform = "";
      if(moved && dy > 90) dismissSheet();
    }
    sheet.addEventListener("touchend", end, {passive:true});
    sheet.addEventListener("touchcancel", end, {passive:true});
  })();

  /* ============================================================
   * BARRA CONCLUIR
   * ========================================================= */
  const kb = document.getElementById("kb");
  function placeKb(){
    const vv = window.visualViewport;
    if(!vv){ kb.style.transform = ""; return; }
    const gap = Math.max(0, window.innerHeight - (vv.offsetTop + vv.height));
    kb.style.transform = "translateY(-"+gap+"px)";
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", placeKb);
    window.visualViewport.addEventListener("scroll", placeKb);
  }
  document.getElementById("kbDone").addEventListener("click", ()=>{
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  });

  /* ============================================================
   * FOCO / DIGITAÇÃO
   * ========================================================= */
  app.addEventListener("focusin", e=>{
    const el = e.target;
    if(el.tagName !== "INPUT") return;
    if(openRow) closeRow(openRow);
    if(el.inputMode === "decimal"){
      kb.classList.add("show"); placeKb();
      setTimeout(()=>{ try{ el.select(); }catch(_){}}, 10);
    }
    setTimeout(()=>{
      if(document.activeElement !== el) return;
      const vv = window.visualViewport;
      const limite = (vv ? vv.offsetTop + vv.height : window.innerHeight) - 64;
      const r = el.getBoundingClientRect();
      if(r.bottom > limite || r.top < 8) el.scrollIntoView({block:"center", behavior:"smooth"});
    }, 320);
  });

  app.addEventListener("focusout", e=>{
    const el = e.target;
    if(el.tagName !== "INPUT") return;
    kb.classList.remove("show");
    if(el.inputMode === "decimal") el.value = fmt(parseNum(el.value));
  });

  app.addEventListener("input", e=>{
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const {act, scope, list, id, taxa} = el.dataset;
    if(act === "name"){
      const it = itemOf(scope, list, id); if(it){ it.name = el.value; save(); } return;
    }
    if(act === "val"){
      const it = itemOf(scope, list, id); if(it){ it.valor = parseNum(el.value); save(); refresh(); } return;
    }
    if(act === "faturamento"){ state.pj.faturamento = parseNum(el.value); save(); refresh(); return; }
    if(act === "taxa"){
      let p = parseNum(el.value); if(p > 100) p = 100;
      state.pj[taxa] = p/100; save(); refresh(); return;
    }
  });

  app.addEventListener("keydown", e=>{
    if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); e.target.blur(); }
  });
  sheet.addEventListener("keydown", e=>{
    if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); e.target.blur(); }
  });

  /* ============================================================
   * CLIQUES
   * ========================================================= */
  app.addEventListener("click", e=>{
    const openMain = e.target.closest(".row-main.open");
    if(openMain){ e.preventDefault(); closeRow(openMain); return; }

    const el = e.target.closest("[data-act]");
    if(!el) return;
    const {act, scope, list, id} = el.dataset;

    if(act === "view"){
      if(state.view === el.dataset.view) return;
      state.view = el.dataset.view; save(); render();
      window.scrollTo({top:0, behavior:"smooth"});
      return;
    }
    if(act === "fold"){
      const card = el.closest(".card");
      const now = !card.classList.contains("open");
      card.classList.toggle("open", now);
      el.setAttribute("aria-expanded", now ? "true":"false");
      state[scope].open[list] = now; save();
      return;
    }
    if(act === "pay"){
      const it = itemOf(scope, list, id); if(!it) return;
      it.pago = !it.pago; save();
      el.setAttribute("aria-checked", it.pago ? "true":"false");
      const rowEl = el.closest(".row");
      rowEl.classList.toggle("paid", it.pago);
      const rc = rowEl.querySelector(".row-check");
      if(rc){ rc.classList.toggle("undo", it.pago); rc.innerHTML = it.pago ? ico.uncheck : ico.check; }
      refresh();
      return;
    }
    if(act === "toggle-pro"){
      state.pf.incluirProLabore = !state.pf.incluirProLabore; save();
      el.setAttribute("aria-checked", state.pf.incluirProLabore ? "true":"false");
      el.closest(".row-auto").classList.toggle("off", !state.pf.incluirProLabore);
      refresh();
      return;
    }
    if(act === "del"){ removeItem(scope, list, id); return; }
    if(act === "sect"){ openSheet(scope, list, false); return; }

    if(act === "new-sect"){
      const cats = state[scope].categories;
      const nova = {id:uid(), name:"", color:CORES[cats.length % CORES.length], items:[]};
      cats.push(nova);
      state[scope].open[nova.id] = true;
      save(); render();
      openSheet(scope, nova.id, true);
      return;
    }
    if(act === "add"){
      const l = listOf(scope, list); if(!l) return;
      const novo = {id:uid(), name:"", valor:0};
      if(list !== "__rendas") novo.pago = false;
      l.push(novo);
      state[scope].open[list] = true;
      save(); render();
      const input = app.querySelector(`.row[data-id="${novo.id}"] .row-name`);
      if(input) input.focus();
      return;
    }
  });

  /* ============================================================
   * INÍCIO
   * ========================================================= */
  (async function init(){
    state = migrate(await load());
    save(); render();
  })();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
